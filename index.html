      function applyFloristTheme(idx) {
        themeIdx = idx % FLORIST_THEMES.length;
        const t = FLORIST_THEMES[themeIdx];

        document.documentElement.style.setProperty("--title-glow", t.titleGlow);
        line2Text.style.backgroundImage = t.titleGradient;
        paletteSwatch.style.background = t.swatch;

        bokehOrbs.forEach((orb, i) => {
          orb.color = t.bokehColors[i % t.bokehColors.length];
        });
        fallingPetals.forEach(pt => {
          pt.color = t.fallingPetalColors[Math.floor(Math.random() * t.fallingPetalColors.length)];
        });

        showToast(`Buket Teması: ${t.name}`);
      }

      document.getElementById("btnReplay").addEventListener("click", (e) => {
        e.stopPropagation();
        [recipientBadge, line1Text, line2Text, personalNoteText].forEach(el => el.classList.remove("is-visible"));
        headerRevealedForCycle = false;
        animStart = performance.now();
        initFireworkHeartSequence();
        showToast("Sürpriz baştan başlıyor ✨", 1800);
      });

      document.getElementById("btnPalette").addEventListener("click", (e) => {
        e.stopPropagation();
        applyFloristTheme(themeIdx + 1);
      });

      const noteModal = document.getElementById("noteModal");
      const fieldRecipient = document.getElementById("fieldRecipient");
      const fieldLine1 = document.getElementById("fieldLine1");
      const fieldLine2 = document.getElementById("fieldLine2");
      const fieldPersonalNote = document.getElementById("fieldPersonalNote");

      const openModal = () => noteModal.classList.remove("modal-hidden");
      const closeModal = () => noteModal.classList.add("modal-hidden");

      document.getElementById("btnEditNote").addEventListener("click", (e) => {
        e.stopPropagation();
        openModal();
      });

      document.getElementById("btnCloseModal").addEventListener("click", closeModal);
      document.getElementById("btnCancelModal").addEventListener("click", closeModal);
      noteModal.addEventListener("click", (e) => {
        if (e.target === noteModal) closeModal();
      });

      document.getElementById("noteForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const rec = fieldRecipient.value.trim();
        const l1 = fieldLine1.value.trim() || "Herkes çiçek alır,";
        const l2 = fieldLine2.value.trim() || "ben senin için kodladım.";
        const note = fieldPersonalNote.value.trim();

        if (rec) {
          recipientText.textContent = rec;
          recipientBadge.style.display = "flex";
        } else {
          recipientBadge.style.display = "none";
        }

        line1Text.textContent = l1;
        line2Text.textContent = l2;

        if (note) {
          personalNoteText.textContent = note;
          personalNoteText.style.display = "block";
        } else {
          personalNoteText.style.display = "none";
        }

        closeModal();
        [recipientBadge, line1Text, line2Text, personalNoteText].forEach(el => el.classList.remove("is-visible"));
        headerRevealedForCycle = false;
        animStart = performance.now();
        initFireworkHeartSequence();
      });

      let reelsModeActive = false;
      function setReelsMode(active) {
        reelsModeActive = active;
        if (active) {
          controlsContainer.classList.add("reels-hidden");
          showToast("Reels Modu • Geri dönmek için çift dokun", 2200);
        } else {
          controlsContainer.classList.remove("reels-hidden");
          showToast("Kontroller geri getirildi", 1500);
        }
      }

      document.getElementById("btnReelsMode").addEventListener("click", (e) => {
        e.stopPropagation();
        setReelsMode(true);
      });

      // Canvas Pointer Events
      let lastTap = 0;
      canvas.addEventListener("pointerdown", (e) => {
        if (!isUnlocked) return;
        const now = performance.now();
        if (reelsModeActive && (now - lastTap < 340)) {
          setReelsMode(false);
          lastTap = 0;
          return;
        }
        lastTap = now;

        targetTiltX = ((e.clientX / W) - 0.5) * 2;
        targetTiltY = ((e.clientY / H) - 0.5) * 2;
        spawnTouchShower(e.clientX, e.clientY);
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!isUnlocked) return;
        targetTiltX = ((e.clientX / W) - 0.5) * 2;
        targetTiltY = ((e.clientY / H) - 0.5) * 2;
      });

      canvas.addEventListener("pointerleave", () => {
        targetTiltX = 0;
        targetTiltY = 0;
      });

      // Global Physical Keyboard Support
      window.addEventListener("keydown", (e) => {
        if (!isUnlocked) {
          if (document.activeElement === pinInput) return;
          if (/^[0-9]$/.test(e.key)) {
            e.preventDefault();
            appendDigit(e.key);
          } else if (e.key === "Backspace" || e.key === "Delete") {
            e.preventDefault();
            backspaceDigit();
          } else if (e.key === "Escape") {
            e.preventDefault();
            clearDigits();
          }
          return;
        }

        if (e.key === "Escape") {
          if (!noteModal.classList.contains("modal-hidden")) closeModal();
          else if (reelsModeActive) setReelsMode(false);
        }
      });

      window.addEventListener("resize", resize);

      // Immediate First-Paint Bootstrap
      function bootstrap() {
        resize();
        initAtmosphere();
        syncPinUI();
        try {
          pinInput.focus({ preventScroll: true });
        } catch (_) {}
        requestAnimationFrame(animate);
      }

      bootstrap();
    })();
  </script>
</body>
</html>
